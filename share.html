<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>红包已包好</title>
    <link rel="stylesheet" href="flow.css?v=20260820" />
  </head>
  <body>
    <main class="screen share">
      <div class="top">
        <a class="back" href="quantity.html">‹</a>
        <span class="fake-brand">◆ Bitget Wallet</span>
        <span>77</span>
      </div>
      <h1>红包已包好</h1>
      <p class="lead">等待 1 位好友领取</p>
      <img id="share-cover" class="hero" src="assets/covers/cover-selected-green.png" alt="已选择的红包" />
      <section class="linkbox">
        <b>红包链接</b><br />
        送你一个红包惊喜！复制口令 <span style="color:#00a8cb">2QP54377</span> 打开 Bitget Wallet 领取，或点击：<br />
        <span id="share-url"></span>
        <button class="copy" onclick="navigator.clipboard?.writeText(document.querySelector('#share-url').textContent);this.textContent='✓'">⧉</button>
      </section>
      <button class="btn next-local" onclick="location.href='receive-code.html'">打开领取页（演示）</button>
    </main>
    <script>
      const cover = Number(sessionStorage.getItem('redPacketCover') ?? 1);
      document.querySelector('#share-cover').src = `assets/covers/cover-0${cover + 1}.png`;
      document.querySelector('#share-url').textContent = new URL('receive-code.html', location.href).href;
    </script>
  </body>
</html>
